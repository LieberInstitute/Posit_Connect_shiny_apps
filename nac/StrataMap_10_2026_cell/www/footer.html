<script>
// spatialLIBD expects an empty string, not null, when no reduction is selected.
(function () {
    const select = document.getElementById('reduced_name');
    if (!select || select.options.length) return;
    select.add(new Option('None (not included)', '', true, true));
    const config = document.querySelector('script[data-for="reduced_name"]');
    if (config) {
        const settings = JSON.parse(config.textContent);
        settings.allowEmptyOption = true;
        config.textContent = JSON.stringify(settings);
    }
}());
</script>
